name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-once:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          elixir-version: '1.19.0'
          otp-version: '28.x'
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: deps
          key: ${{ runner.os }}-mix-1.19.0-28.x-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.19.0-28.x-
      - name: Cache _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: _build
          key: ${{ runner.os }}-build-1.19.0-28.x-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-1.19.0-28.x-
      - name: Install dependencies
        run: mix deps.get
      - name: Run mix ci
        run: mix ci
      - name: Build Docs Warnings as Errors
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors
      - name: Operator UI manifest drift
        run: |
          diff \
            <(bash examples/demo_app/scripts/capture_operator_ui_screenshots.sh --manifest) \
            <(sed -n '/^| name /,/^Total: /p' examples/demo_app/scripts/operator-ui-baseline.md)

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir: ['1.19.0']
        otp: ['26.x', '27.x', '28.x']
        schema_prefix: ['parapet']
      include:
        - elixir: '1.19.0'
          otp: '28.x'
          schema_prefix: 'public'
    env:
      MIX_ENV: test
      PARAPET_SCHEMA_PREFIX: ${{ matrix.schema_prefix }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parapet_concurrency_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Cache _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.schema_prefix }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.schema_prefix }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Compile (force recompile under this prefix leg)
        run: mix compile --force
      - name: Test
        run: mix test

  demo:
    runs-on: ubuntu-latest
    needs: [lint-once, test]
    strategy:
      matrix:
        elixir: ['1.19.0']
        otp: ['26.x', '27.x', '28.x']
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo_app_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache demo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: examples/demo_app/deps
          key: ${{ runner.os }}-demo-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('examples/demo_app/mix.lock') }}
          restore-keys: ${{ runner.os }}-demo-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Cache demo _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: examples/demo_app/_build
          key: ${{ runner.os }}-demo-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('examples/demo_app/mix.lock') }}
          restore-keys: ${{ runner.os }}-demo-build-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install demo dependencies
        run: cd examples/demo_app && mix deps.get
      - name: Compile demo (warnings-as-errors, no-optional-deps)
        run: cd examples/demo_app && mix compile --no-optional-deps --warnings-as-errors
      - name: Create and migrate demo database
        run: cd examples/demo_app && mix ecto.create && mix ecto.migrate
      - name: Seed demo database
        run: cd examples/demo_app && mix run priv/repo/seeds.exs
      - name: Run smoke test
        run: cd examples/demo_app && mix test --only smoke

  release_gate:
    needs: [lint-once, test, demo]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required CI checks passed"
