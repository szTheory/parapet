name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 3 * * *'  # nightly at 03:17 UTC (off-the-hour: avoids GitHub top-of-hour queue delay; house :17 convention)

# Cancel superseded PR runs; pushes to main and nightly schedule runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Matrix is intentionally asymmetric: parapet leg × {27,28,29} OTP, public leg × 28 only.
  # Do NOT "balance" it by adding OTP cells to the public leg — prefix resolution is
  # compile-time (@schema_prefix) and OTP-independent, so one OTP is complete signal.
  # (Retires the v1.7 D-11 coverage-prune; see PROJECT.md Key Decisions.)
  #
  # OTP-29 note: OTP 29 requires Elixir >= 1.20. The OTP-29 cell proves forward-compat
  # under Elixir 1.20.2 — it does NOT imply that a ~> 1.19 adopter can run OTP 29.
  matrix-config:
    name: matrix-config (PR=trimmed, main+nightly=full)
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.resolve.outputs.test-matrix }}
    steps:
      - id: resolve
        name: Resolve test matrix
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'test-matrix={"include":[{"elixir":"1.20.2","otp":"28.x","schema_prefix":"parapet"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'test-matrix={"include":[{"elixir":"1.20.2","otp":"27.x","schema_prefix":"parapet"},{"elixir":"1.20.2","otp":"28.x","schema_prefix":"parapet"},{"elixir":"1.20.2","otp":"29.x","schema_prefix":"parapet"},{"elixir":"1.20.2","otp":"28.x","schema_prefix":"public"}]}' >> "$GITHUB_OUTPUT"
          fi

  lint-once:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.x'
      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: deps
          key: ${{ runner.os }}-mix-1.20.2-28.x-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.20.2-28.x-
      - name: Cache _build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: _build
          key: ${{ runner.os }}-build-1.20.2-28.x-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-1.20.2-28.x-
      - name: Cache PLT
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-28.x-1.20.2-${{ hashFiles('**/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-28.x-1.20.2-
      - name: Install dependencies
        run: mix deps.get
      - name: Run mix ci
        run: mix ci
      - name: Build Docs Warnings as Errors
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors
      - name: Operator UI manifest drift
        run: |
          diff \
            <(bash examples/demo_app/scripts/capture_operator_ui_screenshots.sh --manifest) \
            <(sed -n '/^| name /,/^Total: /p' examples/demo_app/scripts/operator-ui-baseline.md)

  test:
    runs-on: ubuntu-latest
    needs: [matrix-config]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-config.outputs.test-matrix) }}
    env:
      MIX_ENV: test
      PARAPET_SCHEMA_PREFIX: ${{ matrix.schema_prefix }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parapet_concurrency_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Cache _build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.schema_prefix }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.schema_prefix }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Compile (force recompile under this prefix leg)
        run: mix compile --force
      - name: Test
        run: mix test

  demo:
    runs-on: ubuntu-latest
    needs: [lint-once, test]
    if: github.event_name != 'pull_request'
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo_app_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.2'
          otp-version: '28.x'
      - name: Cache demo dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: examples/demo_app/deps
          key: ${{ runner.os }}-demo-mix-1.20.2-28.x-${{ hashFiles('examples/demo_app/mix.lock') }}
          restore-keys: ${{ runner.os }}-demo-mix-1.20.2-28.x-
      - name: Cache demo _build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: examples/demo_app/_build
          key: ${{ runner.os }}-demo-build-1.20.2-28.x-${{ hashFiles('examples/demo_app/mix.lock') }}
          restore-keys: ${{ runner.os }}-demo-build-1.20.2-28.x-
      - name: Install demo dependencies
        run: cd examples/demo_app && mix deps.get
      - name: Compile demo (warnings-as-errors, no-optional-deps)
        run: cd examples/demo_app && mix compile --no-optional-deps --warnings-as-errors
      - name: Create and migrate demo database
        run: cd examples/demo_app && mix ecto.create && mix ecto.migrate
      - name: Seed demo database
        run: cd examples/demo_app && mix run priv/repo/seeds.exs
      - name: Run smoke test
        run: cd examples/demo_app && mix test --only smoke

  release_gate:
    needs: [lint-once, test, demo]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate job results
        run: |
          LINT_RESULT="${{ needs.lint-once.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          DEMO_RESULT="${{ needs.demo.result }}"
          FAILED=0
          if [ "$LINT_RESULT" != "success" ]; then
            echo "lint-once result: $LINT_RESULT (expected: success)"
            FAILED=1
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "test result: $TEST_RESULT (expected: success)"
            FAILED=1
          fi
          if [ "$DEMO_RESULT" != "success" ]; then
            echo "demo result: $DEMO_RESULT (expected: success)"
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more required CI jobs did not succeed. Blocking merge."
            exit 1
          fi
          echo "All required CI checks passed."
