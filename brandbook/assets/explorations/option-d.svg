<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="210" height="64" role="img" aria-labelledby="t d">
  <title id="t">Parapet</title>
  <desc id="d">Direction D — edge and sightline: a low parapet wall and the wordmark share one continuous sightline, with a stone horizon above.</desc>
  <!-- stone horizon (seeing over the edge) -->
  <line x1="10" y1="22" x2="58" y2="22" stroke="#D8D0C3" stroke-width="1.6" stroke-linecap="round"/>
  <!-- low parapet wall -->
  <path d="M14 52 L14 42 L22 42 L22 38 L30 38 L30 42 L42 42 L42 38 L50 38 L50 52 Z" fill="#2E3A42"/>
  <!-- single shared sightline under wall and wordmark -->
  <line x1="4" y1="52" x2="200" y2="52" stroke="#256C82" stroke-width="2.6" stroke-linecap="round"/>
  <text x="72" y="48" font-family="'IBM Plex Sans', Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600" letter-spacing="0.2" fill="#101820">Parapet</text>
</svg>
