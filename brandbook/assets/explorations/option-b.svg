<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 64" width="210" height="64" role="img" aria-labelledby="t d">
  <title id="t">Parapet</title>
  <desc id="d">Direction B — an integrated typemark: the wordmark stands on a stepped parapet wall and a single calm sightline.</desc>
  <text x="8" y="34" font-family="'IBM Plex Sans', Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="0.2" fill="#101820">Parapet</text>
  <!-- the word stands on a parapet: crenellation + wall + sightline -->
  <g fill="#2E3A42">
    <rect x="10" y="44" width="10" height="4"/>
    <rect x="34" y="44" width="10" height="4"/>
    <rect x="58" y="44" width="10" height="4"/>
    <rect x="82" y="44" width="10" height="4"/>
    <rect x="106" y="44" width="10" height="4"/>
    <rect x="130" y="44" width="10" height="4"/>
    <rect x="6" y="48" width="146" height="5"/>
  </g>
  <line x1="6" y1="56" x2="168" y2="56" stroke="#256C82" stroke-width="2.6" stroke-linecap="round"/>
</svg>
